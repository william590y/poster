<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Hyperplane teaser engine</title>
<!--
  EDL-driven video page. teaser.html?edl=short loads edl/short.json.
  Contract: window.render(t) draws edit time t (seconds), window.renderAsync(t) does the same after loading any assets it
  needs, window.DURATION comes from the EDL, window.__ok = true once loaded, window.__err on failure.
  Extra query flags: &guides=1 draws the Reels/TikTok safe zones, &debug=1 labels items and flags "verified": false ones.
  rev2: this page is only the stage. The engine is fx/core.js (helpers, time refs incl. hb: beats, camera, layers, registry,
  setup and render); item types and beat effects are modules listed in fx/index.json (legacy.js holds the r1-r7 types).
  The EDL schema and the module API are documented in edl/README.md ("Modules").
-->
<style>
@font-face { font-family: 'Unbounded'; font-weight: 200 900; src: url('/node_modules/@fontsource-variable/unbounded/files/unbounded-latin-wght-normal.woff2') format('woff2'); }
@font-face { font-family: 'IBM Plex Mono'; font-weight: 400; src: url('/node_modules/@fontsource/ibm-plex-mono/files/ibm-plex-mono-latin-400-normal.woff2') format('woff2'); }
@font-face { font-family: 'IBM Plex Mono'; font-weight: 500; src: url('/node_modules/@fontsource/ibm-plex-mono/files/ibm-plex-mono-latin-500-normal.woff2') format('woff2'); }
@font-face { font-family: 'IBM Plex Mono'; font-weight: 600; src: url('/node_modules/@fontsource/ibm-plex-mono/files/ibm-plex-mono-latin-600-normal.woff2') format('woff2'); }
@font-face { font-family: 'IBM Plex Mono'; font-weight: 700; src: url('/node_modules/@fontsource/ibm-plex-mono/files/ibm-plex-mono-latin-700-normal.woff2') format('woff2'); }
@font-face { font-family: 'Newsreader'; font-style: normal; font-weight: 200 800; src: url('/node_modules/@fontsource-variable/newsreader/files/newsreader-latin-opsz-normal.woff2') format('woff2'); }
@font-face { font-family: 'Newsreader'; font-style: italic; font-weight: 200 800; src: url('/node_modules/@fontsource-variable/newsreader/files/newsreader-latin-opsz-italic.woff2') format('woff2'); }

html, body { margin: 0; background: #000; }
#stage { position: relative; width: 1080px; height: 1920px; overflow: hidden; background: var(--ground, #0E0D12); }
#cam, #fx, #top { position: absolute; inset: 0; pointer-events: none; }
.layer { position: absolute; inset: 0; display: none; transform-origin: 540px 960px; }
.bg { position: absolute; inset: -120px; }
.abs { position: absolute; }
.mono { font-family: 'IBM Plex Mono', monospace; text-transform: uppercase; }
canvas.clip { position: absolute; display: block; }
#grain { position: absolute; inset: 0; display: none; }
#vig { position: absolute; inset: 0; display: none; background: radial-gradient(ellipse 75% 60% at 50% 48%, rgba(0,0,0,0) 55%, rgba(0,0,0,0.55) 100%); }
#flash { position: absolute; inset: 0; opacity: 0; background: #fff; }
#stage { --ink: #15131F; --cream: #F2EBDD; --ondark: #F5F2EA; --dimlight: #4F4A5C; --bandred: #8E1212; }
.guide { position: absolute; border: 3px dashed rgba(0,255,170,0.8); }
.dbg { position: absolute; left: 12px; font: 600 22px/1.2 'IBM Plex Mono', monospace; color: #0f8; background: rgba(0,0,0,0.6); padding: 4px 8px; }
.dbg.bad { color: #fff; background: #d0006f; }
/* rev2: rendering must be a pure function of t: no CSS transitions or animations anywhere on the stage */
#stage, #stage * { transition: none !important; animation: none !important; }
</style>
</head>
<body>
<div id="stage">
  <div id="cam"></div>
  <div id="fx"><div id="grain"></div><div id="vig"></div></div>
  <div id="flash"></div>
  <div id="top"></div>
</div>
<script src="fx/core.js"></script>
</body>
</html>
